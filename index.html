<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japanese Study Dashboard</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#242424;--muted:#777;--line:#ddd;--accent:#8b5cf6;--done:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#202020;color:#fff;padding:22px max(20px,calc((100% - 1100px)/2))}
header h1{margin:0 0 4px;font-size:25px}header p{margin:0;color:#bbb}
main{max-width:1100px;margin:24px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 8px #00000008}
h2,h3{margin:0 0 12px}.muted{color:var(--muted)}.today{font-size:13px;color:var(--muted);margin-bottom:5px}
.progress{height:10px;background:#e8e8e8;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0;transition:.2s}
.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.task input{width:19px;height:19px;accent-color:var(--done)}.task.done .name{text-decoration:line-through;color:#999}
.duration{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.weeknav{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.weekbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}.weekbtn.active{background:#202020;color:#fff}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}button.primary{background:#202020;color:#fff;border-color:#202020}
.small{font-size:13px}.pill{display:inline-block;background:#eee;border-radius:99px;padding:3px 8px;font-size:12px;margin-left:5px}
@media(max-width:760px){.grid{grid-template-columns:1fr}main{margin-top:15px;padding:0 12px}.card{padding:16px}}
</style>
</head>
<body>
<header><h1>Japanese Study Dashboard</h1><p>12-week plan · Tobira + N3 + native Japanese</p></header>
<main>
  <div class="card" style="margin-bottom:18px">
    <div class="today" id="date"></div>
    <h2 id="weekTitle"></h2>
    <p class="muted" id="weekFocus"></p>
    <div class="progress"><div class="bar" id="overallBar"></div></div>
    <p class="small muted" id="overallText"></p>
  </div>

  <div class="weeknav" id="weekNav"></div>

  <div class="grid" style="margin-top:18px">
    <section class="card">
      <h2 id="dayTitle">Today's study</h2>
      <div id="tasks"></div>
    </section>
    <aside>
      <div class="card">
        <h3>12-week roadmap</h3>
        <div id="roadmap"></div>
      </div>
      <div class="card" style="margin-top:18px">
        <h3>Quick stats</h3>
        <div class="stat"><span>Today</span><strong id="todayPct">0%</strong></div>
        <div class="stat"><span>This week</span><strong id="weekPct">0%</strong></div>
        <div class="stat"><span>Overall</span><strong id="allPct">0%</strong></div>
        <div class="actions">
          <button class="primary" onclick="resetToday()">Reset today</button>
          <button onclick="backup()">Export progress</button>
          <label><button onclick="document.getElementById('restore').click()">Import progress</button></label>
          <input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)">
        </div>
      </div>
    </aside>
  </div>
</main>

<script>
const START = new Date("2026-08-31T00:00:00");
const weeks = [
 ["Week 1","N4 diagnostic + WaniKani reset"],
 ["Week 2","N4 repair + clear WaniKani backlog"],
 ["Week 3","Tobira Intermediate · Lesson 1"],
 ["Week 4","Tobira Intermediate · Lesson 2"],
 ["Week 5","Tobira Intermediate · Lesson 3"],
 ["Week 6","Tobira Intermediate · Lesson 4"],
 ["Week 7","Tobira Intermediate · Lesson 5 · midpoint check"],
 ["Week 8","Tobira Intermediate · Lesson 6"],
 ["Week 9","Tobira Intermediate · Lesson 7 + Gateway stretch"],
 ["Week 10","Tobira Intermediate · Lesson 8"],
 ["Week 11","Consolidation + N3 practice"],
 ["Week 12","Final consolidation + N3 test"]
];

const baseTasks = [
 ["WaniKani","30 min"],
 ["Tobira","60 min"],
 ["Shin Kanzen","30–45 min"],
 ["Yotsuba / reading","20–40 min"],
 ["Migaku","30–45 min"],
 ["Shadowing","10–15 min"]
];

function weekIndex(d=new Date()){
 const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
 const s=new Date(START.getFullYear(),START.getMonth(),START.getDate());
 return Math.max(0,Math.min(11,Math.floor((x-s)/86400000/7)));
}
function dayIndex(d=new Date()){
 const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
 const s=new Date(START.getFullYear(),START.getMonth(),START.getDate());
 return Math.max(0,Math.floor((x-s)/86400000));
}
function key(date,task){return date.toISOString().slice(0,10)+"|"+task}
function load(){try{return JSON.parse(localStorage.jpStudy||"{}")}catch{return {}}}
let state=load(), selected=weekIndex();

function tasksFor(w,d){
 let t=[...baseTasks];
 if(w<2)t[1]=["Tobira Beginning · diagnostic/repair","30–45 min"];
 if(w<2)t[2]=["Shin Kanzen N4","30–40 min"];
 if(w===6)t[2]=["N3 midpoint test","45–60 min"];
 if(w>=10)t[1]=["Tobira review","45–60 min"];
 if(w===11)t[2]=["N3 timed practice","45–60 min"];
 if(d%7===2)t.push(["TRY! · grammar repair only","30 min"]);
 if(d%7===5)t.push(["Novel / longer reading","20–30 min"]);
 return t;
}
function render(){
 const now=new Date(), w=selected;
 document.getElementById("date").textContent=now.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
 document.getElementById("weekTitle").textContent=weeks[w][0];
 document.getElementById("weekFocus").textContent=weeks[w][1];

 document.getElementById("weekNav").innerHTML=weeks.map((x,i)=>`<button class="weekbtn ${i===w?"active":""}" onclick="selected=${i};render()">${i+1}</button>`).join("");
 document.getElementById("roadmap").innerHTML=weeks.map((x,i)=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><strong>${x[0]}</strong><br><span class="small muted">${x[1]}</span></div>`).join("");

 const monday=new Date(START); monday.setDate(START.getDate()+w*7);
 let day=Math.min(6, Math.max(0, new Date().getDay()===0?6:new Date().getDay()-1));
 // If viewing a past/future selected week, use Monday; current week uses today's weekday.
 if(w!==weekIndex()) day=0;
 const date=new Date(monday); date.setDate(monday.getDate()+day);
 document.getElementById("dayTitle").textContent=w===weekIndex() ? "Today's study" : date.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
 const tasks=tasksFor(w,w*7+day);
 const dateKey=date.toISOString().slice(0,10);
 document.getElementById("tasks").innerHTML=tasks.map((t,i)=>{
   const k=key(date,t[0]), done=!!state[k];
   return `<label class="task ${done?"done":""}"><input type="checkbox" ${done?"checked":""} onchange="toggle('${k}')"><span class="name">${t[0]}</span><span class="duration">${t[1]}</span></label>`;
 }).join("");
 updateStats();
}
function toggle(k){state[k]=!state[k];localStorage.jpStudy=JSON.stringify(state);render()}
function allTaskKeys(){
 const arr=[];
 for(let w=0;w<12;w++)for(let d=0;d<7;d++)tasksFor(w,w*7+d).forEach(t=>arr.push(key(new Date(START.getTime()+(w*7+d)*86400000),t[0])));
 return arr;
}
function pct(keys){return keys.length?Math.round(keys.filter(k=>state[k]).length/keys.length*100):0}
function updateStats(){
 const now=new Date(), wi=weekIndex();
 const day=Math.min(6,Math.max(0,now.getDay()===0?6:now.getDay()-1));
 const date=new Date(START.getTime()+(wi*7+day)*86400000);
 const todayKeys=tasksFor(wi,wi*7+day).map(t=>key(date,t[0]));
 const weekKeys=[];
 for(let d=0;d<7;d++){let dt=new Date(START.getTime()+(wi*7+d)*86400000);tasksFor(wi,wi*7+d).forEach(t=>weekKeys.push(key(dt,t[0])))}
 const all=allTaskKeys();
 const a=pct(todayKeys),b=pct(weekKeys),c=pct(all);
 document.getElementById("todayPct").textContent=a+"%";
 document.getElementById("weekPct").textContent=b+"%";
 document.getElementById("allPct").textContent=c+"%";
 document.getElementById("overallBar").style.width=c+"%";
 document.getElementById("overallText").textContent=`${c}% of planned study tasks completed`;
}
function resetToday(){
 const wi=weekIndex(),day=Math.min(6,Math.max(0,new Date().getDay()===0?6:new Date().getDay()-1));
 const date=new Date(START.getTime()+(wi*7+day)*86400000);
 tasksFor(wi,wi*7+day).forEach(t=>delete state[key(date,t[0])]);
 localStorage.jpStudy=JSON.stringify(state);render();
}
function backup(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="japanese-study-progress.json";a.click();URL.revokeObjectURL(a.href);
}
function restore(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);localStorage.jpStudy=JSON.stringify(state);render()}catch{alert("Invalid progress file.")}};r.readAsText(f);
}
render();
</script>
</body>
</html>
