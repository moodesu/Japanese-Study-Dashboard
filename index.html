<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japanese Study Dashboard</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--text:#17243a;--muted:#687080;--line:#d9d5ca;--accent:#176b87;--accent2:#c6533d;--done:#3f7d5a;--indigo:#17365d;--gold:#c79a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#17365d 0%,#176b87 72%,#2b7b86 100%);color:#fff;padding:22px max(20px,calc((100% - 1100px)/2));box-shadow:0 4px 18px #17365d22}
header h1{margin:0 0 4px;font-size:25px;letter-spacing:.01em}header p{margin:0;color:#dbe7ea}
main{max-width:1100px;margin:24px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 3px 14px #17365d0c}
h2,h3{margin:0 0 12px}.muted{color:var(--muted)}.today{font-size:13px;color:var(--muted);margin-bottom:5px}
.progress{height:10px;background:#e4e0d6;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--accent),#2b8790);width:0;transition:.2s}
.task{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.taskbody{min-width:0}.taskbtn{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}.taskbtn:hover .name{text-decoration:underline}.taskhint{font-size:12px;color:var(--muted);margin-top:2px}.task input{width:20px;height:20px;accent-color:var(--done);margin:0}.task.done .name{text-decoration:line-through;color:#999}
.task input{width:19px;height:19px;accent-color:var(--done)}.task.done .name{text-decoration:line-through;color:#999}
.duration{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.weeknav{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.weekbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}.weekbtn.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}button.primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.small{font-size:13px}.pill{display:inline-block;background:#dcecef;color:#175b70;border-radius:99px;padding:3px 8px;font-size:12px;margin-left:5px}
@media(max-width:760px){
  header{padding:18px 14px}header h1{font-size:21px}
  main{margin-top:12px;padding:0 10px}
  .card{padding:14px;border-radius:12px}
  .grid{grid-template-columns:1fr;gap:12px}
  .weeknav{margin:0 -2px 0;padding:2px 2px 7px;scroll-snap-type:x proximity}
  .weekbtn{padding:9px 13px;min-width:48px;scroll-snap-align:start}
  .task{gap:9px;padding:12px 0}
  .duration{font-size:12px}
  .taskhint{font-size:11px}
  .modal{align-items:flex-end}
  .modalbox{width:100%;max-height:86vh;border-radius:18px 18px 0 0;padding:20px 16px}
}

.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 12px 50px #0005}
.modalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.close{font-size:22px;border:0;background:#eee;border-radius:50%;width:36px;height:36px;padding:0}
.modalbox h2{margin-bottom:5px}.modalbox h4{margin:18px 0 6px}.modalbox ul{padding-left:20px}.modalbox li{margin:6px 0}.tip{background:#f4f4f4;border-radius:10px;padding:10px 12px;margin-top:14px}

/* v2 focused study dashboard */
.lesson-card{border:1px solid #c9dadd;border-left:4px solid var(--accent);border-radius:12px;padding:14px;margin-top:12px;background:#f5faf9}
.lesson-meta{font-size:12px;color:var(--muted);margin-bottom:4px}.lesson-title{font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{font-size:11px;padding:4px 7px;background:#e9e6dd;color:#445065;border-radius:99px}
.section-title{margin-top:22px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.checkitem{border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--card)}
.notes{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;resize:vertical}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.linkrow a{color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-size:13px}
.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scoregrid input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}
@media(max-width:760px){.checkgrid{grid-template-columns:1fr}.scoregrid{grid-template-columns:1fr}.lesson-card{padding:12px}}

.taskbody .name{font-weight:600}.task:nth-child(odd){background:linear-gradient(90deg,#fffdf800,#fffdf8)}
.task:has(.name) {border-left:3px solid transparent;padding-left:9px}
</style>
</head>
<body>
<header><h1>Japanese Study Dashboard</h1><p>12-week plan · Tobira + N3 + native Japanese</p></header>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modalbox">
    <div class="modalhead"><div><div class="today" id="modalWeek"></div><h2 id="modalTitle"></h2><div class="muted" id="modalDuration"></div></div><button class="close" onclick="closeModal()" aria-label="Close">×</button></div>
    <div id="modalContent"></div>
  </div>
</div>
<main>
  <div class="card" style="margin-bottom:18px">
    <div class="today" id="date"></div>
    <h2 id="weekTitle"></h2>
    <p class="muted" id="weekFocus"></p>
    <div id="foundationOverview"></div>
    <div id="lessonOverview"></div>
    <div class="progress"><div class="bar" id="overallBar"></div></div>
    <p class="small muted" id="overallText"></p>
  </div>

  <div class="weeknav" id="weekNav"></div>

  <div class="grid" style="margin-top:18px">
    <section class="card">
      <h2 id="dayTitle">Today's study</h2>
      <div id="tasks"></div>
    </section>
    <aside>
      <div class="card">
        <h3>12-week roadmap</h3>
        <div id="roadmap"></div>
      </div>
      <div class="card" style="margin-top:18px">
        <h3>Quick stats</h3>
        <div class="stat"><span>Today</span><strong id="todayPct">0%</strong></div>
        <div class="stat"><span>This week</span><strong id="weekPct">0%</strong></div>
        <div class="stat"><span>Overall</span><strong id="allPct">0%</strong></div>
        <div class="actions">
          <button class="primary" onclick="resetToday()">Reset today</button>
          <button onclick="backup()">Export progress</button>
          <label><button onclick="document.getElementById('restore').click()">Import progress</button></label>
          <input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)">
        </div>
      </div>
    </aside>
  </div>
</main>

function weekIndex(d=new Date()){
 const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
 const s=new Date(START.getFullYear(),START.getMonth(),START.getDate());
 return Math.max(0,Math.min(11,Math.floor((x-s)/86400000/7)));
}
function dayIndex(d=new Date()){
 const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
 const s=new Date(START.getFullYear(),START.getMonth(),START.getDate());
 return Math.max(0,Math.floor((x-s)/86400000));
}
function key(date,task){return date.toISOString().slice(0,10)+"|"+task}

function tobiraTaskFor(lesson,day){
 const l=tobiraLessons[lesson-1], d=day%7;
 const reading1=l.readings[0], reading2=l.readings[1];
 const readingBlock=l.readings.length>2 ? `${reading1} + ${l.readings[1]}` : reading1;
 const map=[
  [`Tobira L${l.n} · vocabulary + kanji`, "50–60 min"],
  [`Tobira L${l.n} · grammar + workbook`, "60 min"],
  [`Tobira L${l.n} · reading 1 · ${reading1}`, "60 min"],
  [`Tobira L${l.n} · reading 2 · ${reading2}`, "60 min"],
  [`Tobira L${l.n} · conversation + listening`, "50–60 min"],
  [`Tobira L${l.n} · topic + speaking/project`, "45–60 min"],
  [`Tobira L${l.n} · retrieval + light review`, "20–30 min"]
 ];
 return map[d];
}
const tobiraTaskInfo={
 "vocabulary + kanji":"Learn the lesson vocabulary and kanji actively. Read each item aloud, cover the English/meaning, retrieve it, then make a quick example with the most useful items.",
 "grammar + workbook":"Study the assigned grammar points, say the examples aloud, then complete the matching workbook exercises. Mark errors by type and redo them from memory.",
 "reading 1":"First read for overall meaning. Second pass: investigate only vocabulary/grammar that blocks comprehension or recurs. Finish with a short oral summary.",
 "reading 2":"Repeat the same two-pass method. Compare your understanding with the first reading and collect useful expressions rather than translating every sentence.",
 "conversation + listening":"Listen first without the script, then with it. Practise the target conversation function, shadow useful lines, and produce your own examples using the lesson's language.",
 "topic + speaking/project":"Use the lesson topic for output. Speak for 3–5 minutes, use the target grammar/vocabulary, and complete the relevant Unit Project preparation or activity when assigned.",
 "retrieval + light review":"Close the book and retrieve the lesson vocabulary, grammar and main ideas. Replay difficult audio or reread a difficult passage. Do not start new material."
};

function tasksFor(w,d){
 // 12-week TOBIRA-first curriculum. Weeks 1–8 = one Intermediate lesson/week;
 // Weeks 9–12 = deliberate consolidation and integration rather than new textbook load.

 if(lessonForWeek){
   const [task,dur]=tobiraTaskFor(lessonForWeek,d);
   tasks.push([task,dur]);
 } else if(w===0){
   const prep=[
    ["TOBIRA orientation + diagnostic","45–60 min"],
    ["TOBIRA L1 preview: vocabulary + kanji","45–60 min"],
    ["TOBIRA L1 preview: grammar","45–60 min"],
    ["TOBIRA L1 audio + reading sample","45–60 min"],
    ["TOBIRA L1 speaking baseline","30–45 min"],
    ["TOBIRA setup: study system + notes","30–45 min"],
    ["Week 1 retrieval + plan","20–30 min"]
   ]; tasks.push(prep[d]);
 } else {
   const reviewWeek=w-8;
   const ranges={9:"Lessons 1–2",10:"Lessons 3–4",11:"Lessons 5–6",12:"Lessons 7–8"};
   const range=ranges[w]||"Lessons 1–8";
   const reviewMap=[
    [`TOBIRA consolidation · ${range} · vocabulary + kanji`,"45–60 min"],
    [`TOBIRA consolidation · ${range} · grammar + workbook/worksheets`,"60 min"],
    [`TOBIRA consolidation · ${range} · reading`,"60 min"],
    [`TOBIRA consolidation · ${range} · listening`,"45–60 min"],
    [`TOBIRA consolidation · ${range} · conversation + shadowing`,"45–60 min"],
    [`TOBIRA consolidation · ${range} · speaking/output`,"45–60 min"],
    [`TOBIRA retrieval test · ${range}`,"30–45 min"]
   ]; tasks.push(reviewMap[d]);
 }
 // Supporting activities stay deliberately small: TOBIRA remains the centre of gravity.
 tasks.push(["WaniKani","20–30 min"]);
 tasks.push(["Migaku","20–30 min"]);
 tasks.push(["Shadowing","10–15 min"]);
 tasks.push(["Yotsuba / reading","20–30 min"]);
 if(d===6) tasks.push(["Weekly reflection + error log","15 min"]);
 return tasks;
}

function openTask(name,duration){
 let info=taskInfo[name];
 let lesson=null;
 const m=name.match(/^Tobira L(\d+) · (.+?) — (.+)$/);
 if(m) lesson=tobiraLessons[Number(m[1])-1];
 if(!info && lesson){
   const phase=tobiraTaskInfo[m[3]]||"Complete the assigned lesson work.";
   info={title:`Lesson ${lesson.n} · ${lesson.title}`,text:`${lesson.unit} · pp. ${lesson.pages}. ${phase}`,steps:["Open the assigned TOBIRA I lesson section.","Use the lesson vocabulary, grammar and examples actively rather than reading passively.","Complete the matching workbook work where assigned.","Record anything that still needs review before the next session."]};
 }
 if(!info) info={title:name,text:"Complete this scheduled study activity.",steps:["Follow the week's objective.","Keep notes on anything that needs review."]};
 if(name.startsWith("Tobira Beginning")){
   info.text += ` ${beginningIIWorkbook1.note}`;
   info.steps.push("Use TOBIRA II Workbook 1 only for the exact weak lesson(s): Kanji, Reading, and Writing.");
   info.steps.push("Workbook page map: Lesson 11–20, pp. 6–109. Choose the lesson that corresponds to the gap rather than working through all ten lessons.");
 }

 let extra="";
 if(lesson){
   const checks=lesson.canDo.map((x,i)=>`<label class="checkitem"><input type="checkbox" data-can="${lesson.n}-${i}" ${state["cando|"+lesson.n+"|"+i]?"checked":""} onchange="toggleCanDo(${lesson.n},${i},this.checked)"> ${x}</label>`).join("");
   const links=(lesson.web||[]).map((u,i)=>`<a href="${u}" target="_blank" rel="noopener">${i===0?"TOBIRA audio":"TOBIRA worksheets"}</a>`).join("");
   extra=`<div class="section-title">Can-Do goals</div><div class="checkgrid">${checks}</div>
   <div class="section-title">Lesson components</div><div class="chips">${lesson.components.map(x=>`<span class="chip">${x}</span>`).join("")}</div>
   <div class="section-title">Lesson map</div><div class="tip"><strong>Readings:</strong> ${lesson.readings.join(" · ")}<br><strong>Conversation:</strong> ${lesson.conversation}<br><strong>Topic:</strong> ${lesson.topic}<br><strong>Project:</strong> ${lesson.project}</div>
   ${links?`<div class="linkrow">${links}</div>`:""}
   <div class="section-title">Your notes</div><textarea class="notes" id="lessonNotes" placeholder="Grammar I struggled with… vocabulary to revisit… speaking ideas…">${state["notes|lesson|"+lesson.n]||""}</textarea>
   <div class="actions"><button class="primary" onclick="saveLessonNotes(${lesson.n})">Save notes</button></div>`;
 }
 document.getElementById("modalWeek").textContent=weeks[selected][0];
 document.getElementById("modalTitle").textContent=info.title;
 document.getElementById("modalDuration").textContent=duration;
 document.getElementById("modalContent").innerHTML=`<p>${info.text}</p><h4>What to do</h4><ul>${info.steps.map(x=>`<li>${x}</li>`).join("")}</ul>${extra}<div class="tip"><strong>Focus rule:</strong> stop when the planned time is up. The goal is consistent retrieval and comprehension, not exhausting a chapter in one sitting.</div>`;
 document.getElementById("modal").classList.add("show");
}
function toggleCanDo(lesson,i,v){state["cando|"+lesson+"|"+i]=v;localStorage.jpStudy=JSON.stringify(state)}
function saveLessonNotes(lesson){
 state["notes|lesson|"+lesson]=document.getElementById("lessonNotes").value;
 localStorage.jpStudy=JSON.stringify(state);
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function render(){
 const now=new Date(), w=selected;
 document.getElementById("date").textContent=now.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
 document.getElementById("weekTitle").textContent=weeks[w][0];
 document.getElementById("weekFocus").innerHTML=(w>=2&&w<=9)
   ? `<strong>Lesson ${w-1}:</strong> ${tobiraLessons[w-2].title} <span class="pill">${tobiraLessons[w-2].unit}</span>`
   : weeks[w][1];

 document.getElementById("weekNav").innerHTML=weeks.map((x,i)=>`<button class="weekbtn ${i===w?"active":""}" onclick="selected=${i};render()">${i+1}</button>`).join("");
 document.getElementById("roadmap").innerHTML=weeks.map((x,i)=>{
   let label=x[1];
   if(i>=2&&i<=9){const l=tobiraLessons[i-2];label=`${l.unit}<br>Lesson ${l.n} · ${l.title}`;}
   return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><strong>${x[0]}</strong><br><span class="small muted">${label}</span></div>`;
 }).join("");

 const monday=new Date(START); monday.setDate(START.getDate()+w*7);
 let day=Math.min(6, Math.max(0, new Date().getDay()===0?6:new Date().getDay()-1));
 // If viewing a past/future selected week, use Monday; current week uses today's weekday.
 if(w!==weekIndex()) day=0;
 const date=new Date(monday); date.setDate(monday.getDate()+day);
 document.getElementById("dayTitle").textContent=w===weekIndex() ? "Today's study" : date.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
 const tasks=tasksFor(w,w*7+day);
 const dateKey=date.toISOString().slice(0,10);
 document.getElementById("tasks").innerHTML=tasks.map((t,i)=>{
   const k=key(date,t[0]), done=!!state[k];
   return `<div class="task ${done?"done":""}"><input type="checkbox" ${done?"checked":""} onchange="toggle('${k}')"><div class="taskbody"><button class="taskbtn" onclick="openTask('${t[0].replace(/'/g,"\\'")}','${t[1]}')"><span class="name">${t[0]}</span><div class="taskhint">Tap for what to do</div></button></div><span class="duration">${t[1]}</span></div>`;
 }).join("");
 const fo=document.getElementById("foundationOverview");
 if(w<2){
   fo.innerHTML=`<div class="lesson-card" style="border-left-color:var(--gold);background:#fffaf0">
     <div class="lesson-meta">FOUNDATION / DIAGNOSTIC</div>
     <div class="lesson-title">${beginningIIWorkbook1.title}</div>
     <div class="small muted">Use selectively: Kanji pp. 7–101 · Reading pp. 13–107 · Writing pp. 14–109. Lesson reviews occur at L11–13, L14–16 and L17–19.</div>
     <div class="tip"><strong>Important:</strong> this is not your Intermediate Tobira workbook. It is the correct Beginning Japanese II workbook you own, and we will use it to repair N4 gaps.</div>
   </div>`;
 } else fo.innerHTML="";
 const lo=document.getElementById("lessonOverview");
 if(w>=2&&w<=9){
   const l=tobiraLessons[w-2];
   lo.innerHTML=`<div class="lesson-card"><div class="lesson-meta">${l.unit}</div><div class="lesson-title">Lesson ${l.n} · ${l.title}</div><div class="chips">${l.components.map(x=>`<span class="chip">${x}</span>`).join("")}</div></div>`;
 } else lo.innerHTML="";
 updateStats();
}
function toggle(k){state[k]=!state[k];localStorage.jpStudy=JSON.stringify(state);render()}
function allTaskKeys(){
 const arr=[];
 for(let w=0;w<12;w++)for(let d=0;d<7;d++)tasksFor(w,w*7+d).forEach(t=>arr.push(key(new Date(START.getTime()+(w*7+d)*86400000),t[0])));
 return arr;
}
function pct(keys){return keys.length?Math.round(keys.filter(k=>state[k]).length/keys.length*100):0}
function updateStats(){
 const now=new Date(), wi=weekIndex();
 const day=Math.min(6,Math.max(0,now.getDay()===0?6:now.getDay()-1));
 const date=new Date(START.getTime()+(wi*7+day)*86400000);
 const todayKeys=tasksFor(wi,wi*7+day).map(t=>key(date,t[0]));
 const weekKeys=[];
 for(let d=0;d<7;d++){let dt=new Date(START.getTime()+(wi*7+d)*86400000);tasksFor(wi,wi*7+d).forEach(t=>weekKeys.push(key(dt,t[0])))}
 const all=allTaskKeys();
 const a=pct(todayKeys),b=pct(weekKeys),c=pct(all);
 document.getElementById("todayPct").textContent=a+"%";
 document.getElementById("weekPct").textContent=b+"%";
 document.getElementById("allPct").textContent=c+"%";
 document.getElementById("overallBar").style.width=c+"%";
 document.getElementById("overallText").textContent=`${c}% of planned study tasks completed`;
}
function resetToday(){
 const wi=weekIndex(),day=Math.min(6,Math.max(0,new Date().getDay()===0?6:new Date().getDay()-1));
 const date=new Date(START.getTime()+(wi*7+day)*86400000);
 tasksFor(wi,wi*7+day).forEach(t=>delete state[key(date,t[0])]);
 localStorage.jpStudy=JSON.stringify(state);render();
}
function backup(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="japanese-study-progress.json";a.click();URL.revokeObjectURL(a.href);
}
function restore(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);localStorage.jpStudy=JSON.stringify(state);render()}catch{alert("Invalid progress file.")}};r.readAsText(f);
}
render();
</script>
